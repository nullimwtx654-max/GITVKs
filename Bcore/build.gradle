apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'

    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion


    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"
    buildFeatures {
        aidl true
    }
    buildFeatures {
        prefab true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            
            abiFilters 'arm64-v8a' , 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lintOptions {

        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        checkOnly 'NewApi', 'InlinedApi'
    }
}


// Strip the AIDL-generated "Using: ..." comment line which contains backslash sequences
// that Java's compiler mis-parses as Unicode escapes on Windows paths.
tasks.matching { it.name.startsWith('compileReleaseJavaWithJavac') || it.name.startsWith('compileDebugJavaWithJavac') }.all {
    doFirst {
        def aidlOut = file("$buildDir/generated/aidl_source_output_dir")
        if (aidlOut.exists()) {
            aidlOut.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    def content = f.text
                    if (content.contains(' * Using:')) {
                        content = content.replaceAll(/(?m)^ \* Using:.*$/, '')
                        f.text = content
                    }
                }
            }
        }
    }
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
  implementation 'com.google.android.material:material:1.3.0'
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    implementation 'com.github.tiann:FreeReflection:3.2.2'



    
}

tasks.register('ensureMicroGAssets') {
    def gmsAssetsDir = file("$projectDir/src/main/assets/gms")
    def gmsApk = new File(gmsAssetsDir, "GmsCore.apk")
    def fakeStoreApk = new File(gmsAssetsDir, "FakeStore.apk")

    doLast {
        gmsAssetsDir.mkdirs()
        def downloadIfMissing = { File targetFile, List<String> urls ->
            if (targetFile.exists() && targetFile.length() > 100000L) {
                return
            }
            for (String u : urls) {
                try {
                    logger.lifecycle("Downloading ${targetFile.name} from ${u}...")
                    def conn = new URL(u).openConnection()
                    conn.setConnectTimeout(30000)
                    conn.setReadTimeout(120000)
                    conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                    conn.getInputStream().withStream { ins ->
                        targetFile.withOutputStream { outs ->
                            outs << ins
                        }
                    }
                    if (targetFile.exists() && targetFile.length() > 100000L) {
                        logger.lifecycle("Downloaded ${targetFile.name} (${targetFile.length()} bytes)")
                        break
                    }
                } catch (Throwable t) {
                    logger.warn("Failed to download from ${u}: ${t.message}")
                }
            }
        }

        downloadIfMissing(gmsApk, [
            "https://github.com/microg/GmsCore/releases/download/v0.3.9.250932/com.google.android.gms-250932018.apk",
            "https://github.com/microg/GmsCore/releases/download/v0.3.13.250932/com.google.android.gms-250932022.apk",
            "https://github.com/microg/GmsCore/releases/download/v0.3.17.252432/com.google.android.gms-252432034.apk"
        ])

        downloadIfMissing(fakeStoreApk, [
            "https://github.com/microg/GmsCore/releases/download/v0.3.17.252432/com.android.vending-84022634.apk",
            "https://github.com/microg/GmsCore/releases/download/v0.3.13.250932/com.android.vending-84022622.apk"
        ])
    }
}

preBuild.dependsOn tasks.named('ensureMicroGAssets')
